<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>GrievanceAI | Administrator login</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#1a2a50,#0b1020 60%);color:#eaf0fc;font:14px Inter,system-ui,Arial,sans-serif}.card{width:100%;max-width:420px;border:1px solid #29354e;background:#111a2e;border-radius:16px;padding:30px;box-shadow:0 24px 80px #0004}.brand{font-size:20px;font-weight:850;display:flex;gap:10px;align-items:center;margin-bottom:28px}.logo{background:#6482ff;padding:9px;border-radius:10px}.eyebrow{font-size:10px;letter-spacing:1.7px;color:#a8b7ff;font-weight:800}h1{font-size:27px;margin:10px 0}p{color:#95a4bf;line-height:1.6;font-size:13px}.field{width:100%;padding:12px;background:#0c1426;border:1px solid #35425c;border-radius:8px;color:#eaf0fc;margin:8px 0 17px;outline:none}.field:focus{border-color:#7992ff}label{font-size:12px;color:#b8c5dc;font-weight:650}.btn{width:100%;padding:13px;background:#6482ff;color:white;border:0;border-radius:8px;font-weight:750;cursor:pointer}.error{border:1px solid #6c3948;background:#3a202c;color:#ffa3af;border-radius:8px;padding:11px;margin:15px 0;font-size:12px;line-height:1.5}.back{display:block;margin-top:20px;text-align:center;color:#a8b7ff;text-decoration:none;font-size:12px}
</style></head><body><main class="card"><div class="brand"><span class="logo">✦</span><span>Grievance<span style="color:#91a4ff">AI</span></span></div><div class="eyebrow">RESTRICTED WORKSPACE</div><h1>Administrator login</h1><p>Sign in to review submitted grievances, manage workflow status, and view operational insights.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="/admin/login"><input type="hidden" name="next" value="{{ next }}"><label for="username">Username</label><input class="field" id="username" name="username" autocomplete="username" required><label for="password">Password</label><input class="field" id="password" name="password" type="password" autocomplete="current-password" required><button class="btn" type="submit">Sign in</button></form><a class="back" href="/">← Back to public grievance portal</a></main></body></html>
