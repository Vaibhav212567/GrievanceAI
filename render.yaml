services:
  - type: web
    name: grievanceai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: DATABASE_URL
        fromDatabase:
          name: grievanceai-db
          property: connectionString
databases:
  - name: grievanceai-db
    databaseName: grievanceai
    user: grievanceai
